[project]
name = "p2phunter"
version = "0.1.0"
description = "Telegram-бот: сканер P2P и крипто-арбитражных связок между биржами"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
